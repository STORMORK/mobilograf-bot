<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Адмін-панель</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#090909;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

.container{
width:min(700px,calc(100% - 30px));
margin:0 auto;
padding:30px 0 60px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:30px;
}

h1{
margin:0;
font-size:32px;
}

.back{
color:#fff;
text-decoration:none;
border:1px solid #333;
background:#151515;
padding:11px 14px;
border-radius:12px;
}

.status{
padding:15px;
border-radius:14px;
background:#101010;
border:1px solid #292929;
margin-bottom:20px;
color:#aaa;
}

.card{
background:#111;
border:1px solid #292929;
border-radius:20px;
padding:22px;
}

.field{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:7px;
color:#aaa;
font-size:14px;
}

input,
textarea{
width:100%;
border:1px solid #333;
background:#080808;
color:#fff;
border-radius:12px;
padding:13px;
outline:none;
}

textarea{
min-height:110px;
resize:vertical;
}

.save{
width:100%;
border:0;
background:#fff;
color:#000;
border-radius:13px;
padding:15px;
font-weight:800;
font-size:16px;
cursor:pointer;
}

.save:disabled{
opacity:0.5;
}

#message{
margin-top:15px;
line-height:1.5;
}

.lang-bar{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:8px;
margin-bottom:20px;
padding-bottom:18px;
border-bottom:1px solid #242424;
}

.lang-bar-label{
color:#aaa;
font-size:13px;
margin-right:4px;
}

.lang-tab{
border:1px solid #333;
border-radius:9px;
background:#151515;
color:#fff;
padding:8px 13px;
font-size:13px;
cursor:pointer;
}

.lang-tab.active{
background:#fff;
color:#000;
border-color:#fff;
}

.expand-toggle{
margin-left:auto;
background:transparent;
border:0;
color:#888;
font-size:13px;
cursor:pointer;
text-decoration:underline;
}

.group{
border:1px solid #242424;
border-radius:16px;
margin-bottom:14px;
overflow:hidden;
}

.group summary{
cursor:pointer;
padding:15px 18px;
font-weight:700;
font-size:16px;
background:#141414;
list-style:none;
}

.group summary::-webkit-details-marker{
display:none;
}

.group summary::after{
content:"▸";
float:right;
color:#777;
}

.group[open] summary::after{
content:"▾";
}

.group-body{
padding:18px;
}

.copy-btn{
border:0;
background:transparent;
color:#8ab4ff;
font-size:12px;
padding:6px 0 0;
cursor:pointer;
text-decoration:underline;
}

@media(max-width:600px){

.top{
align-items:flex-start;
flex-direction:column;
}

.back{
width:100%;
text-align:center;
}

}

</style>

</head>


<body>

<div class="container">

<div class="top">

<h1>
Адмін-панель
</h1>

<a
class="back"
href="/"
>
← Назад на сайт
</a>

</div>


<div
id="status"
class="status"
>
Перевірка доступу...
</div>


<div
id="panel"
class="card"
style="display:none;"
>

<div class="lang-bar">

<span class="lang-bar-label">Мова редагування:</span>

<button type="button" class="lang-tab active" data-edit-lang="ua">🇺🇦 UA</button>
<button type="button" class="lang-tab" data-edit-lang="ru">🇷🇺 RU</button>
<button type="button" class="lang-tab" data-edit-lang="en">🇬🇧 EN</button>

<button type="button" id="expandToggle" class="expand-toggle">Розгорнути все</button>

</div>


<div id="groups"></div>


<button
id="saveButton"
class="save"
type="button"
>
💾 Зберегти всі зміни
</button>


<div id="message"></div>

</div>

</div>


<script src="/content-schema.js"></script>
<script>

const tg =
window.Telegram
? window.Telegram.WebApp
: null;


if(tg){

tg.ready();
tg.expand();

}


const status =
document.getElementById("status");

const panel =
document.getElementById("panel");

const message =
document.getElementById("message");

const saveButton =
document.getElementById("saveButton");

const groupsContainer =
document.getElementById("groups");

const expandToggle =
document.getElementById("expandToggle");


const params =
new URLSearchParams(
window.location.search
);


const urlInitData =
params.get("initData");


const telegramInitData =
urlInitData ||
(
tg && tg.initData
? tg.initData
: ""
);


if(!telegramInitData){

status.innerHTML =
"❌ Telegram-дані не знайдені.<br><br>" +
"Адмін-панель потрібно відкривати кнопкою «Адмін» всередині Telegram.";

}else{

checkAdmin();

}


async function checkAdmin(){

try{

const response =
await fetch(
"/api/admin-content.js",
{
method:"GET",

headers:{
"x-telegram-init-data":
telegramInitData
},

cache:"no-store"

}
);


const result =
await response.json();


if(!response.ok){

status.innerHTML =
"❌ Доступ заборонено.<br><br>" +
(
result.error ||
"Помилка авторизації"
);

return;

}


if(!result.isAdmin){

status.innerHTML =
"❌ Ви не адміністратор.";

return;

}


status.innerHTML =
"✅ Адміністратор підтверджений<br>" +
"Telegram ID: " +
result.userId;


panel.style.display =
"block";


if(result.content){

initContentEditor(
result.content
);

}


}catch(error){

console.error(error);

status.innerHTML =
"❌ Помилка з'єднання з сервером.";

}

}


/* =====================================
   UNIVERSAL CONTENT EDITOR

   Driven entirely by CONTENT_SCHEMA (content-schema.js, shared with
   index.html). Adding a new editable text on the site = adding one
   entry to that schema; this editor picks it up automatically, grouped
   and with UA/RU/EN tabs, with no changes needed here.
===================================== */

let draft = {};
let flatDraft = {};
let activeEditLang = "ua";
let allGroupsExpanded = false;


function seedDraftFromContent(content){

content = content || {};

draft = {};

getMultilingualContentSchema().forEach(function(item){

draft[item.key] = {
ua: resolveContentValue(content, item, "ua"),
ru: resolveContentValue(content, item, "ru"),
en: resolveContentValue(content, item, "en")
};

});


flatDraft = {};

getFlatContentSchema().forEach(function(item){

const value = content[item.flatField];

flatDraft[item.flatField] =
value !== null && value !== undefined ? value : "";

});

}


function createFieldElement(item){

const wrapper = document.createElement("div");
wrapper.className = "field";

const label = document.createElement("label");
label.textContent = item.label;
wrapper.appendChild(label);


if(item.multilingual === false){

const input = document.createElement("input");
input.type = "text";
input.dataset.flatKey = item.flatField;

input.addEventListener("input", function(){
flatDraft[item.flatField] = input.value;
});

wrapper.appendChild(input);

return wrapper;

}


const field =
item.type === "textarea"
? document.createElement("textarea")
: document.createElement("input");

if(field.tagName === "INPUT"){
field.type = "text";
}

field.dataset.key = item.key;

field.addEventListener("input", function(){
draft[item.key][activeEditLang] = field.value;
});

wrapper.appendChild(field);


const copyBtn = document.createElement("button");
copyBtn.type = "button";
copyBtn.className = "copy-btn";
copyBtn.textContent = "📋 Скопіювати з UA в усі мови";

copyBtn.addEventListener("click", function(){

const uaValue = draft[item.key].ua;

draft[item.key].ru = uaValue;
draft[item.key].en = uaValue;

refreshFieldValues();

});

wrapper.appendChild(copyBtn);


return wrapper;

}


function buildGroupsDom(){

groupsContainer.innerHTML = "";

CONTENT_GROUPS.forEach(function(group, groupIndex){

const items =
CONTENT_SCHEMA.filter(function(item){
return item.group === group.id;
});

if(items.length === 0){
return;
}

const details = document.createElement("details");
details.className = "group";
details.open = groupIndex === 0;

const summary = document.createElement("summary");
summary.textContent = group.label;
details.appendChild(summary);

const body = document.createElement("div");
body.className = "group-body";

items.forEach(function(item){
body.appendChild(createFieldElement(item));
});

details.appendChild(body);

groupsContainer.appendChild(details);

});

}


function refreshFieldValues(){

document
.querySelectorAll("[data-key]")
.forEach(function(el){

const key = el.dataset.key;

if(draft[key]){
el.value = draft[key][activeEditLang] || "";
}

});


document
.querySelectorAll("[data-flat-key]")
.forEach(function(el){

el.value = flatDraft[el.dataset.flatKey] || "";

});

}


function initContentEditor(content){

seedDraftFromContent(content);
buildGroupsDom();
refreshFieldValues();

}


document
.querySelectorAll(".lang-tab")
.forEach(function(button){

button.addEventListener("click", function(){

activeEditLang = button.dataset.editLang;

document
.querySelectorAll(".lang-tab")
.forEach(function(btn){
btn.classList.remove("active");
});

button.classList.add("active");

refreshFieldValues();

});

});


expandToggle.addEventListener("click", function(){

allGroupsExpanded = !allGroupsExpanded;

document
.querySelectorAll(".group")
.forEach(function(details){
details.open = allGroupsExpanded;
});

expandToggle.textContent =
allGroupsExpanded ? "Згорнути все" : "Розгорнути все";

});


saveButton.addEventListener(
"click",
saveContent
);


async function saveContent(){

saveButton.disabled =
true;

saveButton.textContent =
"Зберігаємо...";

message.textContent =
"";


const content_i18n = {};

Object.keys(draft).forEach(function(key){

content_i18n[key] = {
ua: draft[key].ua,
ru: draft[key].ru,
en: draft[key].en
};

});


const payload =
Object.assign(
{ content_i18n: content_i18n },
flatDraft
);


try{

const response =
await fetch(
"/api/admin-content.js",
{
method:"POST",

headers:{

"Content-Type":
"application/json",

"x-telegram-init-data":
telegramInitData

},

body:
JSON.stringify(payload)

}
);


const result =
await response.json();


if(!response.ok){

const detailsText =
result && result.details
? " (" + JSON.stringify(result.details) + ")"
: "";

throw new Error(
(result && result.error || "Помилка збереження") +
detailsText
);

}


if(!result.data){

throw new Error(
"Сервер не повернув збережені дані"
);

}


seedDraftFromContent(
result.data
);

refreshFieldValues();


message.textContent =
"✅ Зміни успішно збережено!";


const verifyResponse =
await fetch(
"/api/admin-content.js",
{
method:"GET",

headers:{
"x-telegram-init-data":
telegramInitData
},

cache:"no-store"

}
);


const verifyResult =
await verifyResponse.json();


if(
verifyResponse.ok &&
verifyResult.content
){

seedDraftFromContent(
verifyResult.content
);

refreshFieldValues();

}


}catch(error){

console.error(error);

message.textContent =
"❌ " +
error.message;

}


saveButton.disabled =
false;

saveButton.textContent =
"💾 Зберегти всі зміни";

}

</script>

</body>

</html>
