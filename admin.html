<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Адмін-панель</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#090909;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

.container{
width:min(700px,calc(100% - 30px));
margin:0 auto;
padding:30px 0 60px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:30px;
}

h1{
margin:0;
font-size:32px;
}

.back{
color:#fff;
text-decoration:none;
border:1px solid #333;
background:#151515;
padding:11px 14px;
border-radius:12px;
}

.status{
padding:15px;
border-radius:14px;
background:#101010;
border:1px solid #292929;
margin-bottom:20px;
color:#aaa;
}

.card{
background:#111;
border:1px solid #292929;
border-radius:20px;
padding:22px;
}

.field{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:7px;
color:#aaa;
font-size:14px;
}

input,
textarea{
width:100%;
border:1px solid #333;
background:#080808;
color:#fff;
border-radius:12px;
padding:13px;
outline:none;
}

textarea{
min-height:110px;
resize:vertical;
}

.save{
width:100%;
border:0;
background:#fff;
color:#000;
border-radius:13px;
padding:15px;
font-weight:800;
font-size:16px;
}

#message{
margin-top:15px;
line-height:1.5;
}

@media(max-width:600px){

.top{
align-items:flex-start;
flex-direction:column;
}

.back{
width:100%;
text-align:center;
}

}

</style>

</head>


<body>

<div class="container">

<div class="top">

<h1>
Адмін-панель
</h1>

<a
class="back"
href="/"
>
← Назад на сайт
</a>

</div>


<div
id="status"
class="status"
>
Перевірка доступу...
</div>


<div
id="panel"
class="card"
style="display:none;"
>

<div class="field">

<label>
Заголовок
</label>

<input
id="hero_title"
type="text"
>

</div>


<div class="field">

<label>
Текст під заголовком
</label>

<textarea
id="hero_text"
></textarea>

</div>


<div class="field">

<label>
Заголовок блоку «Що я роблю»
</label>

<input
id="about_title"
type="text"
>

</div>


<div class="field">

<label>
Телефон
</label>

<input
id="phone"
type="text"
>

</div>


<div class="field">

<label>
Telegram
</label>

<input
id="telegram"
type="text"
>

</div>


<div class="field">

<label>
Instagram
</label>

<input
id="instagram"
type="text"
>

</div>


<div class="field">

<label>
Локація
</label>

<input
id="location"
type="text"
>

</div>


<button
id="saveButton"
class="save"
type="button"
>
Зберегти зміни
</button>


<div id="message"></div>

</div>

</div>


<script>

const tg =
window.Telegram
? window.Telegram.WebApp
: null;


if(tg){

tg.ready();
tg.expand();

}


const status =
document.getElementById("status");

const panel =
document.getElementById("panel");

const message =
document.getElementById("message");

const saveButton =
document.getElementById("saveButton");


const params =
new URLSearchParams(
window.location.search
);


const urlInitData =
params.get("initData");


const telegramInitData =
urlInitData ||
(
tg && tg.initData
? tg.initData
: ""
);


if(!telegramInitData){

status.innerHTML =
"❌ Telegram-дані не знайдені.<br><br>" +
"Адмін-панель потрібно відкривати кнопкою «Адмін» всередині Telegram.";

}else{

checkAdmin();

}


async function checkAdmin(){

try{

const response =
await fetch(
"/api/admin-content.js",
{
method:"GET",

headers:{
"x-telegram-init-data":
telegramInitData
},

cache:"no-store"

}
);


const result =
await response.json();


if(!response.ok){

status.innerHTML =
"❌ Доступ заборонено.<br><br>" +
(
result.error ||
"Помилка авторизації"
);

return;

}


if(!result.isAdmin){

status.innerHTML =
"❌ Ви не адміністратор.";

return;

}


status.innerHTML =
"✅ Адміністратор підтверджений<br>" +
"Telegram ID: " +
result.userId;


panel.style.display =
"block";


if(result.content){

fillForm(
result.content
);

}


}catch(error){

console.error(error);

status.innerHTML =
"❌ Помилка з'єднання з сервером.";

}

}


function fillForm(data){

document.getElementById(
"hero_title"
).value =
data.hero_title || "";


document.getElementById(
"hero_text"
).value =
data.hero_text || "";


document.getElementById(
"about_title"
).value =
data.about_title || "";


document.getElementById(
"phone"
).value =
data.phone !== null &&
data.phone !== undefined
? data.phone
: "";


document.getElementById(
"telegram"
).value =
data.telegram !== null &&
data.telegram !== undefined
? data.telegram
: "";


document.getElementById(
"instagram"
).value =
data.instagram !== null &&
data.instagram !== undefined
? data.instagram
: "";


document.getElementById(
"location"
).value =
data.location !== null &&
data.location !== undefined
? data.location
: "";

}


saveButton.addEventListener(
"click",
saveContent
);


async function saveContent(){

saveButton.disabled =
true;

saveButton.textContent =
"Зберігаємо...";

message.textContent =
"";


const data = {

hero_title:
document.getElementById(
"hero_title"
).value,

hero_text:
document.getElementById(
"hero_text"
).value,

about_title:
document.getElementById(
"about_title"
).value,

phone:
document.getElementById(
"phone"
).value,

telegram:
document.getElementById(
"telegram"
).value,

instagram:
document.getElementById(
"instagram"
).value,

location:
document.getElementById(
"location"
).value

};


try{

const response =
await fetch(
"/api/admin-content.js",
{
method:"POST",

headers:{

"Content-Type":
"application/json",

"x-telegram-init-data":
telegramInitData

},

body:
JSON.stringify(data)

}
);


const result =
await response.json();


if(!response.ok){

throw new Error(
result.error ||
"Помилка збереження"
);

}


if(!result.data){

throw new Error(
"Сервер не повернув збережені дані"
);

}


fillForm(
result.data
);


message.textContent =
"✅ Зміни успішно збережено!";


const verifyResponse =
await fetch(
"/api/admin-content.js",
{
method:"GET",

headers:{
"x-telegram-init-data":
telegramInitData
},

cache:"no-store"

}
);


const verifyResult =
await verifyResponse.json();


if(
verifyResponse.ok &&
verifyResult.content
){

fillForm(
verifyResult.content
);

}


}catch(error){

console.error(error);

message.textContent =
"❌ " +
error.message;

}


saveButton.disabled =
false;

saveButton.textContent =
"Зберегти зміни";

}

</script>

</body>

</html>
